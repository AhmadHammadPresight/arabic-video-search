[project]
name = "avs"
version = "0.1.0"
description = "Arabic AI video search PoC: search uploaded CCTV recordings with Arabic text"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "python-multipart",
    "qdrant-client",
    "numpy",
    "pillow",
    "pyyaml",
    "torch",
    "torchvision",
    "transformers",
    "sentencepiece",
    "rfdetr",
    "trackers",
    "supervision",
    "truststore",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["e2e: needs the running services and fetched footage (scripts/start.sh, scripts/fetch_footage.sh)"]
addopts = "-m 'not e2e'"
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]
