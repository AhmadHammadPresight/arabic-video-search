# Seeded evaluation set for the option A baseline (scripts/evaluate.sh runs it).
#
# Each query is searched through the API with its camera and time filters, the way an officer
# narrows a search to the cameras and hours that matter. Within those filters every matching
# person or bag was picked by eye from the indexed tracks (track contact sheets, not search
# results), so precision counts every real match.
#
# Targets are written as anchors: a point on the target (camera, local time, x and y as
# fractions of the frame), taken from a box centre at a sampled frame. A result track counts as
# correct when one of its boxes contains an anchor within half a second. Anchors do not depend
# on track ids, so they still hold after re-indexing with other settings.
#
# register: formal (Modern Standard Arabic), jordanian, gulf, mixed (Arabic with English words),
# or english (for comparison).
# source: captain = written by the captain, verbatim; otherwise written for this set.
# expect: no-match = nobody in the footage matches; reported but left out of the averages.
# fields: what the text says, in the schema of src/avs/fields.py, for scoring the query model
# (python -m avs.tools.compare_query_models); anything not named is expected empty. A list of
# values means any of them is right (see src/avs/tools/parse_scoring.py).
# added: phase2 = written in phase 2, after the fusion weights were set on the first 48 queries,
# so the README reports those queries on their own as well.
#
# Bags held by a target are separate tracks; a query about a person also accepts their bag
# where the description names it.

