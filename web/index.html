<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title"></title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<!-- Every visible string comes from web/locales/<language>.json through the data-i18n attributes.
     Elements marked data-tech only exist in the technical view at /tech. -->
<body>
  <header class="topbar">
    <div class="brand">
      <h1 data-i18n="app.heading"></h1>
      <span class="view-badge" data-tech data-i18n="app.techView"></span>
    </div>
    <div class="session">
      <label><span data-i18n="session.officer"></span>
        <input id="actor" type="text" maxlength="80" data-i18n-placeholder="session.officerPlaceholder" autocomplete="off">
      </label>
      <label><span data-i18n="session.case"></span>
        <input id="case-id" type="text" maxlength="80" data-i18n-placeholder="session.casePlaceholder" autocomplete="off">
      </label>
      <button id="lang-switch" type="button" class="lang-switch" data-i18n="lang.switch" data-i18n-title="lang.switchTitle"></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="search" aria-selected="true" data-i18n="tab.search"></button>
    <button role="tab" data-tab="recordings" aria-selected="false" data-i18n="tab.recordings"></button>
    <button role="tab" data-tab="audit" aria-selected="false" data-i18n="tab.audit"></button>
    <button role="tab" data-tab="hood" aria-selected="false" data-tech data-i18n="tab.hood"></button>
  </nav>

  <main>
    <section id="tab-search" class="panel">
      <form id="search-form" class="search-form">
        <label class="query-label" for="query" data-i18n="search.label"></label>
        <div class="query-row">
          <input id="query" name="query" type="search" dir="auto" maxlength="500" required
                 data-i18n-placeholder="search.placeholder" autocomplete="off">
          <button type="submit" class="primary" data-i18n="search.submit"></button>
        </div>
        <div id="examples" class="examples" data-i18n-aria-label="search.examples"></div>
        <fieldset class="mode" data-tech data-i18n-aria-label="mode.label">
          <label class="chip"><input type="radio" name="mode" value="hybrid" checked><span data-i18n="mode.hybrid"></span></label>
          <label class="chip"><input type="radio" name="mode" value="baseline"><span data-i18n="mode.baseline"></span></label>
        </fieldset>
        <details class="filters" open>
          <summary data-i18n="filters.title"></summary>
          <div class="filter-grid">
            <fieldset>
              <legend data-i18n="filters.cameras"></legend>
              <div id="camera-filter" class="camera-filter"><span class="muted" data-i18n="filters.noCameras"></span></div>
            </fieldset>
            <fieldset>
              <legend data-i18n="filters.time"></legend>
              <label><span data-i18n="filters.from"></span> <input id="time-from" type="datetime-local" step="1"></label>
              <label><span data-i18n="filters.to"></span> <input id="time-to" type="datetime-local" step="1"></label>
            </fieldset>
          </div>
        </details>
      </form>
      <p id="search-status" class="status" role="status"></p>
      <div id="parsed" class="parsed" hidden></div>
      <p id="check-status" class="status" role="status"></p>
      <div id="results" class="results"></div>
    </section>

    <section id="tab-recordings" class="panel" hidden>
      <form id="upload-form" class="upload-form">
        <h2 data-i18n="upload.title"></h2>
        <div class="upload-grid">
          <label><span data-i18n="upload.file"></span>
            <input name="file" type="file" accept="video/*,.avi,.mpg,.mpeg,.mkv,.ts" required>
          </label>
          <label><span data-i18n="upload.camera"></span>
            <input name="camera_id" type="text" dir="ltr" required pattern="[A-Za-z0-9_.\-]{1,40}" placeholder="G421">
          </label>
          <label><span data-i18n="upload.place"></span>
            <input name="place" type="text" dir="auto" required maxlength="200" data-i18n-placeholder="upload.placePlaceholder">
          </label>
          <label><span data-i18n="upload.start"></span>
            <input name="start_time" type="datetime-local" step="1" required>
          </label>
        </div>
        <div class="upload-actions">
          <button type="submit" class="primary" data-i18n="upload.submit"></button>
          <progress id="upload-progress" max="1" value="0" hidden></progress>
          <span id="upload-status" class="status" role="status"></span>
        </div>
      </form>
      <h2 data-i18n="recordings.title"></h2>
      <div class="table-wrap">
        <table class="recordings">
          <thead><tr>
            <th data-i18n="recordings.camera"></th>
            <th data-i18n="recordings.place"></th>
            <th data-i18n="recordings.start"></th>
            <th data-i18n="recordings.length"></th>
            <th data-i18n="recordings.status"></th>
            <th data-i18n="recordings.tracks"></th>
            <th></th>
          </tr></thead>
          <tbody id="recordings-body"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-hood" class="panel" data-tech hidden>
      <p class="muted" data-i18n="hood.intro"></p>
      <p id="health" class="health" role="status"></p>
      <nav class="subtabs" role="tablist">
        <button role="tab" data-hood="search" aria-selected="true" data-i18n="hood.searchTab"></button>
        <button role="tab" data-hood="recording" aria-selected="false" data-i18n="hood.recordingTab"></button>
      </nav>
      <div id="hood-search" class="hood-panel">
        <form id="trace-form" class="search-form">
          <label class="query-label" for="trace-query" data-i18n="trace.label"></label>
          <div class="query-row">
            <input id="trace-query" type="search" dir="auto" maxlength="500" required data-i18n-placeholder="trace.placeholder" autocomplete="off">
            <button type="submit" class="primary" data-i18n="trace.submit"></button>
          </div>
          <p class="muted small" data-i18n="trace.note"></p>
        </form>
        <form id="trace-open" class="inline-form">
          <label><span data-i18n="trace.openLabel"></span>
            <input id="trace-id" type="text" dir="ltr" maxlength="32" data-i18n-placeholder="trace.openPlaceholder" autocomplete="off">
          </label>
          <button type="submit" data-i18n="trace.open"></button>
        </form>
        <p id="trace-status" class="status" role="status"></p>
        <div id="trace-columns" class="trace-columns"></div>
      </div>
      <div id="hood-recording" class="hood-panel" hidden>
        <form id="rectrace-form" class="inline-form">
          <label><span data-i18n="rectrace.recording"></span>
            <select id="rectrace-recording"></select>
          </label>
          <label><span data-i18n="rectrace.moments"></span>
            <input id="rectrace-at" type="text" dir="ltr" placeholder="12.5, 40" autocomplete="off">
          </label>
          <button type="submit" class="primary" data-i18n="rectrace.submit"></button>
        </form>
        <p id="rectrace-status" class="status" role="status"></p>
        <div id="rectrace" class="rectrace"></div>
      </div>
    </section>

    <section id="tab-audit" class="panel" hidden>
      <div class="audit-head">
        <h2 data-i18n="audit.title"></h2>
        <button id="audit-refresh" type="button" data-i18n="audit.refresh"></button>
      </div>
      <p class="muted" data-i18n="audit.note"></p>
      <div class="table-wrap">
        <table class="audit">
          <thead><tr>
            <th>#</th>
            <th data-i18n="audit.time"></th>
            <th data-i18n="audit.officer"></th>
            <th data-i18n="audit.action"></th>
            <th data-i18n="audit.details"></th>
          </tr></thead>
          <tbody id="audit-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <template id="result-card">
    <article class="card">
      <div class="media">
        <img class="crop" data-i18n-alt="card.cropAlt" loading="lazy">
        <div class="player">
          <video muted playsinline preload="metadata"></video>
          <span class="rank"></span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-line"><strong class="camera"></strong><span class="label-badge"></span><span class="score"></span></div>
        <div class="place"></div>
        <div class="time" dir="ltr"></div>
        <div class="why"></div>
        <div class="check"></div>
        <div class="verdict">
          <button type="button" class="confirm" data-i18n="card.confirm"></button>
          <button type="button" class="reject" data-i18n="card.reject"></button>
        </div>
      </div>
    </article>
  </template>
</body>
</html>
